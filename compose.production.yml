name: snagtime-production

x-runtime: &runtime
  NODE_ENV: production
  DATABASE_PROVIDER: postgresql
  NEXT_PUBLIC_APP_URL: https://snagtime.aiautomationauthority.com
  NEXT_PUBLIC_COUNCILFORGE_SSO_ONLY: "true"
  SNAGTIME_STANDALONE_MODE: "true"
  SNAGTIME_COUNCILFORGE_ONLY: "true"
  DEMO_MODE: "false"
  EMAIL_PROVIDER: disabled
  CALENDAR_PROVIDER: internal
  PAYMENTS_PROVIDER: stub
  OUTBOX_WORKER_MODE: dedicated
  OUTBOX_WORKER_ENABLED: "false"
  BUILD_ID: ${BUILD_ID:?set immutable build identity}

services:
  web:
    image: snagtime:${BUILD_ID:?set immutable build identity}
    build:
      context: .
      target: runtime
      args:
        BUILD_ID: ${BUILD_ID:?set immutable build identity}
        NEXT_PUBLIC_COUNCILFORGE_SSO_ONLY: "true"
    command: ["node", "apps/web/server.js"]
    environment:
      <<: *runtime
      DATABASE_ROLE: app
      DATABASE_URL_FILE: /run/secrets/app_database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      BOOKING_CAPABILITY_KEY_ID: councilforge-v1
      BOOKING_CAPABILITY_SECRET_FILE: /run/secrets/booking_capability_secret
      BOOKING_CAPABILITY_KEYRING_FILE: /run/secrets/booking_capability_keyring
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      EMAIL_TOKEN_SECRET_FILE: /run/secrets/email_token_secret
      TENANT_CONTEXT_SECRET_FILE: /run/secrets/tenant_context_secret
      RATE_LIMIT_HASH_SECRET_FILE: /run/secrets/rate_limit_hash_secret
      PROXY_SHARED_SECRET_FILE: /run/secrets/proxy_shared_secret
      OPERATOR_HEALTH_SECRET_FILE: /run/secrets/operator_health_secret
      SNAGTIME_SSO_SECRET_FILE: /run/secrets/snagtime_sso_secret
      RATE_LIMIT_PROVIDER: postgresql
      RATE_LIMIT_MAX_BUCKETS: "100000"
      TRUST_PROXY: "true"
    secrets:
      - app_database_url
      - postgres_ca_cert
      - auth_secret
      - booking_capability_secret
      - booking_capability_keyring
      - token_encryption_key
      - email_token_secret
      - tenant_context_secret
      - rate_limit_hash_secret
      - proxy_shared_secret
      - operator_health_secret
      - snagtime_sso_secret
    networks:
      - councilforge-public
      - traefik-public
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.snagtime.rule: Host(`snagtime.aiautomationauthority.com`)
      traefik.http.routers.snagtime.entrypoints: websecure
      traefik.http.routers.snagtime.tls: "true"
      traefik.http.routers.snagtime.tls.certresolver: letsencrypt
      traefik.http.routers.snagtime.middlewares: snagtime-trusted-proxy@file
      traefik.http.services.snagtime.loadbalancer.server.port: "3000"

  worker:
    image: snagtime:${BUILD_ID:?set immutable build identity}
    command: ["node", "dist/worker.mjs"]
    environment:
      <<: *runtime
      DATABASE_ROLE: worker
      WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      EMAIL_TOKEN_SECRET_FILE: /run/secrets/email_token_secret
    secrets:
      - worker_database_url
      - postgres_ca_cert
      - token_encryption_key
      - email_token_secret
    networks:
      - councilforge-public
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 45s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

secrets:
  app_database_url: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/app_database_url" }
  worker_database_url: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/worker_database_url" }
  auth_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/auth_secret" }
  booking_capability_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/booking_capability_secret" }
  booking_capability_keyring: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/booking_capability_keyring" }
  token_encryption_key: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/token_encryption_key" }
  email_token_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/email_token_secret" }
  tenant_context_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/tenant_context_secret" }
  rate_limit_hash_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/rate_limit_hash_secret" }
  proxy_shared_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/proxy_shared_secret" }
  operator_health_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/operator_health_secret" }
  snagtime_sso_secret: { file: "${SNAGTIME_SECRETS_DIR:-/opt/snagtime/secrets}/snagtime_sso_secret" }
  postgres_ca_cert: { file: "${COUNCILFORGE_POSTGRES_CA_FILE:-/opt/councilforge/postgres-certs/server.crt}" }

networks:
  councilforge-public: { external: true }
  traefik-public: { external: true }
